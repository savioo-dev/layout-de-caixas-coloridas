<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conjunto de Caixas Coloridas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Conjunto de Caixas Coloridas</h1>
  </header>
  <main class="flex-container">
    <div class="box box1">
      <h2>Caixa 1</h2>
      <p>Vermelho</p>
    </div>
    <div class="box box2">
      <h2>Caixa 2</h2>
      <p>Laranja</p>
    </div>
    <div class="box box3">
      <h2>Caixa 3</h2>
      <p>Amarelo</p>
    </div>
    <div class="box box4">
      <h2>Caixa 4</h2>
      <p>Verde</p>
    </div>
    <div class="box box5">
      <h2>Caixa 5</h2>
      <p>Azul</p>
    </div>
    <div class="box box6">
      <h2>Caixa 6</h2>
      <p>Índigo</p>
    </div>
  </main>
</body>
</html>
